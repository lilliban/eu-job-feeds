name: Update dataset

# Every six hours. Job adverts do not change faster than that, the diffs stay
# readable, and the request load on the providers stays defensible if anyone
# looks. See docs/DECISIONS.md #12.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Restrict to a provider or provider:slug"
        required: false
        type: string

concurrency:
  # Two runs writing the same files would race on the commit. A queued run is
  # pointless anyway: the next one reads the same feeds.
  group: update-dataset
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Download the previous dataset from the "latest" release
        # `jobs.sqlite` is the only durable state between runs now that
        # per-company files are no longer committed to git — see
        # docs/DECISIONS.md #18. The tag `latest` is always explicit, never
        # GitHub's "most recently published release" resolution, which after
        # prune-history.yml runs would resolve to a dated snapshot-YYYY-MM.
        run: |
          mkdir -p state
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download latest --repo "$GITHUB_REPOSITORY" \
              --pattern 'jobs.sqlite.gz' --dir state --clobber
            gzip -dk -f state/jobs.sqlite.gz
          else
            echo "No 'latest' release yet; starting with an empty database."
          fi

      - name: Run the collector
        id: collect
        env:
          # Optional. Unset until job_matcher hands us an endpoint — the
          # collector runs identically either way (see src/eu_job_feeds/notify.py).
          JOB_MATCHER_WEBHOOK_URL: ${{ secrets.JOB_MATCHER_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python -m eu_job_feeds.cli update --db state/jobs.sqlite --only "${{ inputs.only }}"
          else
            python -m eu_job_feeds.cli update --db state/jobs.sqlite
          fi

      - name: Validate the dataset against the contract
        # A malformed row must never reach the consumer. This is the last gate
        # before publishing.
        run: python -m eu_job_feeds.cli validate --db state/jobs.sqlite

      - name: Commit registry and stats only
        # The postings themselves are published as a release asset below, not
        # committed to git — see docs/DECISIONS.md #18. This step must not
        # exit early when there is nothing to commit: the release publish
        # below has to run on every invocation, since `jobs.sqlite` changes
        # on nearly every run even when the registry does not.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry data/index.json
          if git diff --cached --quiet; then
            echo "No registry/stats changes this run."
            echo "- No registry/stats changes this run." >> "$GITHUB_STEP_SUMMARY"
          else
            changed=$(git diff --cached --name-only | wc -l)
            git commit -m "data: refresh registry/stats ($changed file(s))"
            # A concurrent prune-history run may have moved the branch under us.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Publish jobs.sqlite and changes.json to the "latest" release
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest state/jobs.sqlite.gz state/changes.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest state/jobs.sqlite.gz state/changes.json \
              --repo "$GITHUB_REPOSITORY" --title "Latest dataset" \
              --notes "Continuously updated. See docs/DECISIONS.md #18." \
              --target "${GITHUB_REF_NAME}"
          fi
